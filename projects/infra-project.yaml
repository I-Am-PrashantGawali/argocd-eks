apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "EKS infrastructure — cluster add-ons, controllers, monitoring, ESO"

  sourceRepos:
    - https://github.com/I-Am-PrashantGawali/argocd-eks.git    # ArgoCD self-config
    - https://github.com/I-Am-PrashantGawali/gitops-eks-infra.git # EKS post-deploy manifests
    # Helm repos used by infra apps
    - https://aws.github.io/eks-charts
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns
    - https://prometheus-community.github.io/helm-charts
    - https://charts.external-secrets.io

  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: monitoring

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: storage.k8s.io
      kind: StorageClass
    - group: external-secrets.io
      kind: ClusterSecretStore

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: infra-deployer
      description: CI/CD service account for infra deployments
      policies:
        - p, proj:infra:infra-deployer, applications, sync,   infra/*, allow
        - p, proj:infra:infra-deployer, applications, get,    infra/*, allow
        - p, proj:infra:infra-deployer, applications, update, infra/*, allow
      groups:
        - COGNIVRAI:owners

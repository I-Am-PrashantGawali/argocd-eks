# Portfolio Website — static HTML/CSS/JS site
# Source: I-Am-PrashantGawali.github.io repo → k8s/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-website
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: apps

  source:
    repoURL: https://github.com/I-Am-PrashantGawali/I-Am-PrashantGawali.github.io.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

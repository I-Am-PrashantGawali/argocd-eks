# Installs External Secrets Operator via Helm
# ESO syncs MongoDB credentials from AWS Secrets Manager into the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infra

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.9.11"
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        serviceAccount:
          annotations:
            # Replace with the IRSA role ARN from eks-cloudformation/08-secrets-irsa.yaml output
            eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/workshop-external-secrets-irsa"

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
